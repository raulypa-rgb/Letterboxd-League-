name: Update watch time

on:
  schedule:
    - cron: '7,37 * * * *'   # every 30 minutes (GitHub may start scheduled runs a few minutes late)
  workflow_dispatch:
  push:
    paths:
      - data/members.json

permissions:
  contents: write

concurrency:
  group: watch-time
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch Letterboxd diaries
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: node scripts/fetch-watch-time.mjs
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update watch time data"
          git push
