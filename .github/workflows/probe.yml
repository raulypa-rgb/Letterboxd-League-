name: Probe diary (temporary)
on:
  push:
    branches: [claude/busy-hamilton-u4t3pq]
    paths: [scripts/probe-diary.mjs, .github/workflows/probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/probe-diary.mjs
