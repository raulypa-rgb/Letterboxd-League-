<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Box Office League</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: marquee header over a trade-sheet body; tabbed views, tables for the numbers. */
:root {
  --bg: #eceef3;
  --surface: #ffffff;
  --ink: #161a2c;
  --muted: #5d6479;
  --line: #d5d9e3;
  --accent: #d9950f;
  --accent-ink: #1b1400;
  --marquee: #1c2140;
  --marquee-ink: #fff6dd;
  --good: #1f8a53;
  --bad: #c2393f;
  --chip: #e3e6ef;
  --font-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1120; --surface: #171b2d; --ink: #e8eaf3; --muted: #9aa1b8; --line: #2a3048;
    --accent: #f0b43a; --accent-ink: #1b1400; --marquee: #070914; --marquee-ink: #fff3d1;
    --good: #4cc587; --bad: #ef6b70; --chip: #242a42; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1120; --surface: #171b2d; --ink: #e8eaf3; --muted: #9aa1b8; --line: #2a3048;
  --accent: #f0b43a; --accent-ink: #1b1400; --marquee: #070914; --marquee-ink: #fff3d1;
  --good: #4cc587; --bad: #ef6b70; --chip: #242a42; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-body); padding: 0 16px 48px; }
.wrap { max-width: 1080px; margin: 0 auto; display: grid; gap: 20px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; letter-spacing: .01em; }
h2 { font-size: 1.9rem; font-weight: 800; text-transform: uppercase; line-height: 1; }
h3 { font-size: 1.25rem; font-weight: 800; text-transform: uppercase; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.label { font-size: .72rem; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 600; }

/* Marquee */
.marquee { margin: 16px auto 0; max-width: 1080px; width: 100%; background: var(--marquee); color: var(--marquee-ink);
  border-radius: 6px; padding: 22px 24px 18px; position: relative; }
.marquee::before, .marquee::after { content: ""; position: absolute; left: 12px; right: 12px; height: 8px;
  background: radial-gradient(circle, var(--accent) 2.6px, transparent 3.2px) 0 0 / 18px 8px repeat-x; }
.marquee::before { top: 6px; } .marquee::after { bottom: 6px; }
.marquee-row { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
.marquee .eyebrow { font-size: .72rem; letter-spacing: .24em; text-transform: uppercase; opacity: .7; font-weight: 600; }
.marquee h1 { font-size: clamp(2.2rem, 7vw, 3.8rem); font-weight: 900; text-transform: uppercase; line-height: .95; }
.seasons { display: flex; gap: 6px; flex-wrap: wrap; }
.seasons button { font-family: var(--font-display); font-weight: 800; font-size: 1.05rem; text-transform: uppercase; letter-spacing: .04em;
  background: transparent; color: var(--marquee-ink); border: 1.5px solid color-mix(in srgb, var(--marquee-ink) 35%, transparent);
  padding: 6px 12px 5px; border-radius: 4px; cursor: pointer; line-height: 1.1; text-align: left; }
.seasons button span { display: block; font-family: var(--font-body); font-weight: 500; font-size: .68rem; letter-spacing: .06em; opacity: .75; }
.seasons button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

/* Tabs */
nav.tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--line); overflow-x: auto; }
nav.tabs button { background: none; border: 0; padding: 10px 14px; font: 600 .95rem var(--font-body); color: var(--muted); cursor: pointer;
  border-bottom: 3px solid transparent; margin-bottom: -2px; white-space: nowrap; }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

.banner { background: var(--chip); border-radius: 6px; padding: 10px 14px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 18px; display: grid; gap: 14px; min-width: 0; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; align-items: start; }
.head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }

/* Controls */
button, input, select, textarea { font: inherit; color: inherit; }
.btn { background: var(--ink); color: var(--surface); border: 0; border-radius: 4px; padding: 8px 14px; font-weight: 600; cursor: pointer; }
.btn.accent { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn.danger { background: transparent; color: var(--bad); border: 1.5px solid currentColor; }
.btn.sm { padding: 4px 10px; font-size: .85rem; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }
input, select, textarea { background: var(--bg); border: 1.5px solid var(--line); border-radius: 4px; padding: 7px 10px; min-width: 0; }
textarea { width: 100%; font-family: var(--font-mono); font-size: .8rem; }
.field { display: grid; gap: 4px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
.row > .field { flex: 1 1 140px; }

/* Tables */
.tscroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .92rem; }
th { text-align: left; font-size: .7rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 600; padding: 6px 8px; border-bottom: 1.5px solid var(--line); white-space: nowrap; }
td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
td.r, th.r { text-align: right; }
tr:last-child td { border-bottom: 0; }
.rank { font-family: var(--font-display); font-weight: 900; font-size: 1.6rem; width: 2.2rem; line-height: 1; }
.rank.first { color: var(--accent); }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; vertical-align: 1px; }
.studio-name { font-weight: 600; }
.bar { height: 6px; background: var(--chip); border-radius: 3px; overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; border-radius: 3px; }
.chip { display: inline-block; font-size: .72rem; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--chip); color: var(--muted); white-space: nowrap; }
.chip.live { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good); }
.chip.clock { background: var(--accent); color: var(--accent-ink); }
.pos { color: var(--good); } .neg { color: var(--bad); }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { background: var(--surface); border: 1.5px solid var(--line); border-radius: 4px; padding: 7px 12px; font-weight: 600; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.chip.hit { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good); }
.chip.bomb { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); }
.board-row-label { font-size: .7rem; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); align-self: center; }
.gross-input { width: 6.5rem; text-align: right; font-family: var(--font-mono); }

/* Draft */
.clock { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 14px 16px; border-radius: 6px; background: var(--marquee); color: var(--marquee-ink); }
.clock strong { font-family: var(--font-display); font-size: 1.8rem; font-weight: 900; text-transform: uppercase; line-height: 1; }
.board { display: grid; gap: 6px; }
.board-cell { background: var(--bg); border-radius: 4px; padding: 6px 8px; font-size: .8rem; min-height: 44px; border-left: 4px solid var(--line); }
.board-cell.next { outline: 2px dashed var(--accent); }
.board-cell .pk { font-family: var(--font-mono); font-size: .68rem; color: var(--muted); }
.avail { display: grid; gap: 6px; max-height: 520px; overflow-y: auto; }
.avail-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 4px; }
.avail-item .t { font-weight: 600; }
.empty { padding: 22px; text-align: center; color: var(--muted); border: 1.5px dashed var(--line); border-radius: 6px; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--surface);
  padding: 10px 16px; border-radius: 6px; font-weight: 600; z-index: 10; max-width: calc(100% - 32px); }
@media (prefers-reduced-motion: no-preference) { .toast { animation: rise .2s ease-out; } @keyframes rise { from { transform: translate(-50%, 8px); opacity: 0; } } }
@media (max-width: 560px) { .hide-sm { display: none; } .panel { padding: 14px; } }
</style>
</head>
<body>
<header class="marquee" id="marquee"></header>
<main class="wrap" style="margin-top:16px">
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <div id="view"></div>
</main>
<div class="toast" id="toast" hidden></div>
<script>
(() => {
const SEASONS = [
  { key: 'winter', name: 'Winter', months: 'Jan – Apr', start: '01-01', end: '04-30' },
  { key: 'summer', name: 'Summer', months: 'May – Aug', start: '05-01', end: '08-31' },
  { key: 'fall',   name: 'Fall',   months: 'Sep – Dec', start: '09-01', end: '12-31' },
];
const VIEWS = [['standings', 'Standings'], ['draft', 'Draft'], ['slate', 'Slate & Grosses'], ['league', 'League']];
const COLORS = ['#d9950f', '#3b6fd8', '#c2393f', '#1f8a53', '#8a4fd1', '#12a0a8', '#d8579a', '#6b7a2a', '#e06a1f', '#5a6378'];
const STORE = 'box-office-league-v1';
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = m => ((Number(m) || 0) < 0 ? '−$' : '$') + Math.abs(Number(m) || 0).toLocaleString('en-US', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + 'M';
const today = () => new Date().toISOString().slice(0, 10);
const fmtDate = d => d ? new Date(d + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : 'TBA';

// A film only scores once it has a gross; before release it counts as zero, not as a loss of its budget.
const profitOf = m => m && Number(m.gross) ? Number(m.gross) - (Number(m.budget) || 0) : 0;
const profitCell = m => m && Number(m.gross) ? signed(profitOf(m)) : '<span class="muted">pending</span>';
const signed = v => `<span class="${v < 0 ? 'neg' : v > 0 ? 'pos' : ''}">${money(v)}</span>`;

function blankSeason() { return { status: 'setup', rounds: 4, order: [], picks: [], movies: [] }; }
function blankYear() { return { status: 'setup', order: [], picks: [] }; }
const seasonForDate = d => { const mo = d ? +d.slice(5, 7) : 0; return mo && mo <= 4 ? 'winter' : mo && mo <= 8 ? 'summer' : 'fall'; };

function demoLeague() {
  const studios = [
    ['Marquee Pictures', 'Sam'], ['Blue Hour Studios', 'Jordan'], ['Red Carpet Co.', 'Alex'],
    ['Greenlight Films', 'Priya'], ['Silver Screen Studios', 'Morgan'], ['Night Owl Pictures', 'Casey'],
  ].map(([name, owner], i) => ({ id: 's' + (i + 1), name, owner, color: COLORS[i] }));
  let n = 0;
  const films = list => list.map(([title, release, gross, budget]) => ({ id: 'm' + (++n), title, release, gross, budget }));
  const summerFilms = films([
    ['Inside Out 2', '2024-06-14', 653.0, 200], ['Deadpool & Wolverine', '2024-07-26', 636.7, 200], ['Despicable Me 4', '2024-07-03', 361.0, 100],
    ['Twisters', '2024-07-19', 267.8, 155], ['Bad Boys: Ride or Die', '2024-06-07', 193.6, 100], ['Kingdom of the Planet of the Apes', '2024-05-10', 171.1, 160],
    ['A Quiet Place: Day One', '2024-06-28', 138.9, 67], ['It Ends with Us', '2024-08-09', 148.5, 25], ['Furiosa: A Mad Max Saga', '2024-05-24', 67.5, 168],
    ['Alien: Romulus', '2024-08-16', 105.3, 80], ['IF', '2024-05-17', 110.3, 110], ['The Garfield Movie', '2024-05-24', 92.3, 60],
    ['The Fall Guy', '2024-05-03', 92.9, 130], ['Longlegs', '2024-07-12', 74.3, 10], ['Horizon: An American Saga – Chapter 1', '2024-06-28', 29.3, 100],
    ['Trap', '2024-08-02', 42.0, 30], ['Fly Me to the Moon', '2024-07-12', 20.6, 100], ['Borderlands', '2024-08-09', 15.1, 115],
    ['The Watchers', '2024-06-07', 15.5, 30],
  ]);
  const winterFilms = films([
    ['Dune: Part Two', '2024-03-01', 282.1, 190], ['Kung Fu Panda 4', '2024-03-08', 193.6, 85],
    ['Godzilla x Kong: The New Empire', '2024-03-29', 196.3, 135], ['Madame Web', '2024-02-14', 43.8, 80],
    ['Mean Girls', '2024-01-12', 72.4, 36], ['Bob Marley: One Love', '2024-02-14', 96.9, 70],
  ]);
  const fallFilms = films([
    ['Beetlejuice Beetlejuice', '2024-09-06', 294.1, 100], ['Joker: Folie à Deux', '2024-10-04', 58.3, 190],
    ['Venom: The Last Dance', '2024-10-25', 139.7, 120], ['Wicked', '2024-11-22', 473.2, 150],
    ['Moana 2', '2024-11-27', 460.0, 150], ['Gladiator II', '2024-11-22', 172.4, 250],
    ['The Wild Robot', '2024-09-27', 143.9, 78], ['Smile 2', '2024-10-18', 69.0, 28],
  ]);
  const all = [...summerFilms, ...winterFilms, ...fallFilms];
  const idOf = t => all.find(m => m.title === t).id;
  const order = studios.map(s => s.id);
  // Summer: 3 rounds, snake order
  const summer = { status: 'live', rounds: 3, order, movies: summerFilms, picks: [] };
  ['Inside Out 2', 'Deadpool & Wolverine', 'Despicable Me 4', 'Twisters', 'Bad Boys: Ride or Die', 'Kingdom of the Planet of the Apes',
   'It Ends with Us', 'A Quiet Place: Day One', 'Alien: Romulus', 'IF', 'The Garfield Movie', 'Longlegs',
   'The Fall Guy', 'Furiosa: A Mad Max Saga', 'Trap', 'Horizon: An American Saga – Chapter 1', 'Fly Me to the Moon', 'The Watchers',
  ].forEach((t, i) => summer.picks.push({ movieId: idOf(t), studioId: snakeStudio(order, i) }));
  // Hit round, then the bomb round snakes back
  const yearDraft = { status: 'live', order, picks: [] };
  ['Wicked', 'Dune: Part Two', 'Moana 2', 'Beetlejuice Beetlejuice', 'Kung Fu Panda 4', 'The Wild Robot',
   'Joker: Folie à Deux', 'Madame Web', 'Gladiator II', 'Borderlands', 'Venom: The Last Dance', 'Godzilla x Kong: The New Empire',
  ].forEach((t, i) => yearDraft.picks.push({ movieId: idOf(t), studioId: snakeStudio(order, i), type: i < order.length ? 'hit' : 'bomb' }));
  return {
    demo: true, name: 'Demo League', year: 2024, basis: 'Domestic', tmdbKey: '', studios, yearDraft,
    seasons: { winter: { ...blankSeason(), movies: winterFilms }, summer, fall: { ...blankSeason(), movies: fallFilms } },
  };
}

function snakeStudio(order, i) {
  const n = order.length, r = Math.floor(i / n), p = i % n;
  return r % 2 === 0 ? order[p] : order[n - 1 - p];
}

let league, ui = { season: 'summer', view: 'standings', q: '' };
function load() {
  try { const raw = localStorage.getItem(STORE); if (raw) { const d = JSON.parse(raw); league = d.league; ui = { ...ui, ...d.ui, q: '' }; } } catch (e) {}
  if (!league || !league.seasons || league.demo) league = demoLeague();
}
function save() { try { localStorage.setItem(STORE, JSON.stringify({ league, ui: { season: ui.season, view: ui.view } })); } catch (e) {} }

let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2600);
}

// Two-step confirm (the viewer blocks confirm() dialogs)
const armed = new Set();
function confirmed(key, btn, label) {
  if (armed.has(key)) { armed.delete(key); return true; }
  armed.add(key); btn.textContent = label || 'Click again to confirm';
  setTimeout(() => { if (armed.delete(key)) render(); }, 3500);
  return false;
}

const S = () => league.seasons[ui.season];
const seasonMeta = k => SEASONS.find(s => s.key === k);
const studio = id => league.studios.find(s => s.id === id);
const movieById = (season, id) => season.movies.find(m => m.id === id);
const ownerOf = (season, movieId) => { const p = season.picks.find(p => p.movieId === movieId); return p ? studio(p.studioId) : null; };
const Y = () => league.yearDraft || (league.yearDraft = blankYear());
const findMovie = id => { for (const x of SEASONS) { const m = league.seasons[x.key].movies.find(m => m.id === id); if (m) return m; } return null; };
const yearPickFor = movieId => Y().picks.find(p => p.movieId === movieId);
const seasonPickFor = movieId => { for (const x of SEASONS) { const p = league.seasons[x.key].picks.find(p => p.movieId === movieId); if (p) return p; } return null; };
const byRelease = (a, b) => (a.release || '9').localeCompare(b.release || '9');
// Films still open in a season draft (hit and bomb picks are off the board)
const seasonPool = s => s.movies.filter(m => !s.picks.some(p => p.movieId === m.id) && !yearPickFor(m.id));
// Films open in the hit & bomb draft: anything on any season slate not already taken
const yearPool = () => SEASONS.flatMap(x => league.seasons[x.key].movies).filter(m => !yearPickFor(m.id) && !seasonPickFor(m.id));
function yearPicksOf(studioId) {
  const p = Y().picks, hit = p.find(x => x.studioId === studioId && x.type === 'hit'), bomb = p.find(x => x.studioId === studioId && x.type === 'bomb');
  return { hit: hit && findMovie(hit.movieId), bomb: bomb && findMovie(bomb.movieId) };
}

function seasonScores(season) {
  return league.studios.map(st => {
    const films = season.picks.filter(p => p.studioId === st.id).map(p => movieById(season, p.movieId)).filter(Boolean);
    const opened = films.filter(m => Number(m.gross));
    const gross = opened.reduce((a, m) => a + Number(m.gross), 0);
    const budget = opened.reduce((a, m) => a + (Number(m.budget) || 0), 0);
    const best = films.slice().sort((a, b) => profitOf(b) - profitOf(a))[0];
    return { st, films, gross, budget, profit: gross - budget, best };
  }).sort((a, b) => b.profit - a.profit);
}

/* ---------- Render ---------- */
function render() {
  renderMarquee();
  document.getElementById('tabs').innerHTML = VIEWS.map(([k, n]) =>
    `<button role="tab" data-act="view" data-k="${k}" aria-selected="${ui.view === k}">${n}</button>`).join('');
  const v = document.getElementById('view');
  const demo = league.demo ? `<div class="banner" style="margin-bottom:20px"><span><strong>This is a demo league</strong> using 2024 releases with approximate domestic grosses and reported production budgets.</span>
    <button class="btn accent sm" data-act="view" data-k="league">Start your own league</button></div>` : '';
  v.innerHTML = demo + ({ standings: viewStandings, draft: viewDraft, slate: viewSlate, league: viewLeague })[ui.view]();
}

function renderMarquee() {
  document.getElementById('marquee').innerHTML = `<div class="marquee-row">
    <div><div class="eyebrow">Fantasy box office · ${esc(league.year)} · Profit on ${esc(league.basis.toLowerCase())} gross</div><h1>${esc(league.name)}</h1></div>
    <div class="seasons">${SEASONS.map(s => `<button data-act="season" data-k="${s.key}" aria-pressed="${ui.season === s.key}">${s.name}<span>${s.months}</span></button>`).join('')}</div>
  </div>`;
}

function statusChip(s) {
  if (s.status === 'live') return '<span class="chip live">Season live</span>';
  if (s.status === 'drafting') return '<span class="chip clock">Draft in progress</span>';
  return '<span class="chip">Pre-draft</span>';
}

function viewStandings() {
  const s = S(), meta = seasonMeta(ui.season), rows = seasonScores(s);
  const max = Math.max(1, ...rows.map(r => Math.abs(r.profit)));
  const seasonTable = s.picks.length ? `<div class="tscroll"><table>
    <thead><tr><th></th><th>Studio</th><th class="r">Films</th><th class="hide-sm">Top earner</th><th class="r hide-sm">Gross</th><th class="r hide-sm">Budget</th><th class="r">Profit</th></tr></thead>
    <tbody>${rows.map((r, i) => `<tr>
      <td><span class="rank ${i === 0 && r.profit > 0 ? 'first' : ''}">${i + 1}</span></td>
      <td style="min-width:170px"><span class="dot" style="background:${r.st.color}"></span><span class="studio-name">${esc(r.st.name)}</span>
        <div class="muted small">${esc(r.st.owner)}</div><div class="bar"><i style="width:${(Math.max(0, r.profit) / max * 100).toFixed(1)}%;background:${r.st.color}"></i></div></td>
      <td class="r num">${r.films.length}</td>
      <td class="hide-sm small">${r.best ? esc(r.best.title) + ' <span class="num">' + profitCell(r.best) + '</span>' : '<span class="muted">—</span>'}</td>
      <td class="r num small hide-sm">${money(r.gross)}</td><td class="r num small hide-sm">${money(r.budget)}</td>
      <td class="r num" style="font-weight:600">${signed(r.profit)}</td></tr>`).join('')}</tbody></table></div>
    <p class="muted small" style="margin:0">Profit = ${esc(league.basis.toLowerCase())} box office gross − production budget, added up across a studio's films. Films score once they have a gross, and flops count against you.</p>`
    : `<div class="empty">No films drafted for ${meta.name} yet. Build the slate, then run the draft.<br><br>
       <button class="btn accent sm" data-act="view" data-k="${s.movies.length ? 'draft' : 'slate'}">${s.movies.length ? 'Go to the draft' : 'Build the slate'}</button></div>`;

  // Year-long totals: three seasons + your hit pick + every rival's bomb pick
  const picks = league.studios.map(st => ({ st, ...yearPicksOf(st.id) }));
  const year = league.studios.map(st => {
    const per = SEASONS.map(m => seasonScores(league.seasons[m.key]).find(r => r.st.id === st.id));
    const { hit } = yearPicksOf(st.id);
    const hitP = profitOf(hit);
    const bombP = picks.filter(x => x.st.id !== st.id && x.bomb).reduce((a, x) => a + profitOf(x.bomb), 0);
    return { st, hit, hitP, bombP, per: per.map(x => x.films.length ? x.profit : null), total: per.reduce((a, b) => a + b.profit, 0) + hitP + bombP };
  }).sort((a, b) => b.total - a.total);
  const champs = SEASONS.map(m => { const sc = seasonScores(league.seasons[m.key]); return sc[0] && sc[0].films.length && sc[0].profit > 0 ? sc[0].st.id : null; });
  const hasYearPicks = Y().picks.length > 0;
  const hitBomb = hasYearPicks ? `<section class="panel"><div class="head"><h2>Hit &amp; bomb picks</h2><span class="label">Year-long · ${esc(league.year)}</span></div>
      <div class="tscroll"><table><thead><tr><th>Studio</th><th>Hit pick</th><th class="r">Hit profit</th><th>Bomb pick</th><th class="r">Bomb profit</th></tr></thead>
      <tbody>${picks.map(x => `<tr><td style="white-space:nowrap"><span class="dot" style="background:${x.st.color}"></span><span class="studio-name">${esc(x.st.name)}</span></td>
        <td>${x.hit ? esc(x.hit.title) + `<div class="muted small">${fmtDate(x.hit.release)}</div>` : '<span class="muted">—</span>'}</td><td class="r num small">${x.hit ? profitCell(x.hit) : '—'}</td>
        <td>${x.bomb ? esc(x.bomb.title) + `<div class="muted small">${fmtDate(x.bomb.release)}</div>` : '<span class="muted">—</span>'}</td><td class="r num small">${x.bomb ? profitCell(x.bomb) : '—'}</td></tr>`).join('')}</tbody></table></div>
      <p class="muted small" style="margin:0">A studio's hit pick adds its profit to that studio's year. A bomb pick's profit or loss goes to every other studio, so a bomb that flops sinks your rivals and one that turns a profit helps them.</p>
    </section>` : '';

  return `<div style="display:grid;gap:20px">
    <section class="panel"><div class="head"><h2>${meta.name} ${esc(league.year)}</h2>${statusChip(s)}</div>${seasonTable}</section>
    <section class="panel"><div class="head"><h2>Year to date</h2><span class="label">Seasons + hit + rivals' bombs</span></div>
      <div class="tscroll"><table><thead><tr><th>Studio</th>${SEASONS.map(m => `<th class="r">${m.name}</th>`).join('')}<th class="r">Hit</th><th class="r">Bombs</th><th class="r">Total</th></tr></thead>
      <tbody>${year.map(r => `<tr><td><span class="dot" style="background:${r.st.color}"></span><span class="studio-name">${esc(r.st.name)}</span>
        ${champs.filter(c => c === r.st.id).length ? `<span class="chip" title="Season titles won">${'★'.repeat(champs.filter(c => c === r.st.id).length)}</span>` : ''}</td>
        ${r.per.map(g => `<td class="r num small">${g === null ? '—' : signed(g)}</td>`).join('')}
        <td class="r num small" title="${r.hit ? esc(r.hit.title) : 'No hit pick'}">${r.hit ? signed(r.hitP) : '—'}</td>
        <td class="r num small" title="Combined profit of rivals' bomb picks">${hasYearPicks ? signed(r.bombP) : '—'}</td>
        <td class="r num" style="font-weight:600">${signed(r.total)}</td></tr>`).join('')}</tbody></table></div>
      <p class="muted small" style="margin:0">★ marks a season title. The year total adds up all three seasons, your hit pick, and the profit or loss of every rival's bomb pick. The biggest total wins the year.</p>
    </section>
    ${hitBomb}
  </div>
  ${s.picks.length ? `<section class="panel" style="margin-top:20px"><h3>Studio slates</h3><div class="grid2">${rows.map(r => `<div style="min-width:0">
      <div class="label" style="color:${r.st.color}">${esc(r.st.name)}</div>
      <table><tbody>${r.films.map(m => `<tr><td>${esc(m.title)}<div class="muted small">${fmtDate(m.release)}${m.release > today() ? ' · upcoming' : ''}</div></td><td class="r num small">${profitCell(m)}<div class="muted small" style="white-space:nowrap">${money(m.gross)} − ${money(m.budget)}</div></td></tr>`).join('') || '<tr><td class="muted">No films</td></tr>'}</tbody></table></div>`).join('')}</div></section>` : ''}`;
}

function draftRoom(d, o) {
  const n = d.order.length, i = d.picks.length, done = d.status === 'live' || i >= o.total;
  const onClock = done ? null : studio(snakeStudio(d.order, i));
  const q = ui.q.toLowerCase();
  const avail = o.pool.filter(m => m.title.toLowerCase().includes(q)).sort(byRelease);
  const clock = done
    ? `<div class="clock"><strong>${o.doneTitle}</strong><span>${o.doneText}</span></div>`
    : `<div class="clock"><span class="label" style="color:inherit;opacity:.7">On the clock · ${o.roundName(Math.floor(i / n))} · pick ${i + 1} of ${o.total}</span>
       <strong style="color:${onClock.color}">${esc(onClock.name)}</strong><span>${esc(onClock.owner)}</span></div>`;
  const board = `<div class="tscroll"><div class="board" style="grid-template-columns:auto repeat(${n}, minmax(120px,1fr))"><div></div>
    ${d.order.map(id => { const st = studio(id); return `<div class="label" style="color:${st.color}">${esc(st.name)}</div>`; }).join('')}
    ${Array.from({ length: o.rounds }, (_, r) => `<div class="board-row-label">${o.roundShort(r)}</div>` + d.order.map((id, c) => {
      const col = r % 2 === 0 ? c : n - 1 - c, idx = r * n + col;
      const p = d.picks[idx], m = p && findMovie(p.movieId);
      return `<div class="board-cell ${idx === i && !done ? 'next' : ''}" style="border-left-color:${studio(id).color}"><div class="pk">${r + 1}.${col + 1}</div>${m ? esc(m.title) : ''}</div>`;
    }).join('')).join('')}</div></div>`;
  return `<div style="display:grid;gap:20px">${clock}
    <div class="grid2">
      <section class="panel"><div class="head"><h3>Available films</h3><span class="muted small num">${avail.length} left</span></div>
        <input id="q" type="search" placeholder="Search films" value="${esc(ui.q)}" aria-label="Search available films">
        <div class="avail">${avail.map(m => `<div class="avail-item"><div style="min-width:0"><div class="t">${esc(m.title)}</div>
          <div class="muted small">${o.showSeason ? seasonMeta(seasonForDate(m.release)).name + ' · ' : ''}${fmtDate(m.release)}${m.budget ? ' · ' + money(m.budget) + ' budget' : ''}</div></div>
          <button class="btn sm accent" data-act="pick" data-mode="${o.mode}" data-id="${m.id}" ${done ? 'disabled' : ''}>${o.pickLabel(Math.floor(i / n))}</button></div>`).join('') || '<div class="empty">No films match.</div>'}</div>
      </section>
      <section class="panel"><div class="head"><h3>Draft board</h3><div class="row">
        <button class="btn sm ghost" data-act="undo" data-mode="${o.mode}" ${i ? '' : 'disabled'}>Undo last pick</button>
        <button class="btn sm danger" data-act="reset-draft" data-mode="${o.mode}">Reset draft</button></div></div>${board}</section>
    </div></div>`;
}

/* ---------- Actions ---------- */
function newLeague() {
  league = { demo: false, name: 'My Box Office League', year: new Date().getFullYear(), basis: 'Domestic', tmdbKey: '',
    studios: Array.from({ length: 6 }, (_, i) => ({ id: uid(), name: `Studio ${i + 1}`, owner: `Player ${i + 1}`, color: COLORS[i] })),
    yearDraft: blankYear(), seasons: { winter: blankSeason(), summer: blankSeason(), fall: blankSeason() } };
  ui.draftMode = null;
  const m = new Date().getMonth();
  ui.season = m < 4 ? 'winter' : m < 8 ? 'summer' : 'fall';
}

async function tmdb(path, params = {}) {
  const u = new URL('https://api.themoviedb.org/3' + path);
  u.searchParams.set('api_key', league.tmdbKey);
  Object.entries(params).forEach(([k, v]) => u.searchParams.set(k, v));
  const r = await fetch(u); if (!r.ok) throw new Error('TMDB returned ' + r.status);
  return r.json();
}

async function tmdbImport() {
  const s = S(), meta = seasonMeta(ui.season); let added = 0;
  try {
    for (let page = 1; page <= 3; page++) {
      const d = await tmdb('/discover/movie', { region: 'US', with_release_type: '3', sort_by: 'popularity.desc', page,
        'release_date.gte': `${league.year}-${meta.start}`, 'release_date.lte': `${league.year}-${meta.end}`, with_original_language: 'en' });
      for (const r of d.results) {
        if (s.movies.some(m => m.tmdbId === r.id || m.title.toLowerCase() === r.title.toLowerCase())) continue;
        s.movies.push({ id: uid(), title: r.title, release: r.release_date, gross: 0, budget: 0, tmdbId: r.id }); added++;
      }
      if (page >= d.total_pages) break;
    }
    toast(`Imported ${added} films. Remove any that aren't opening wide.`);
  } catch (e) { toast('Import failed. Check the API key, or self-host the page so it can reach TMDB.'); }
  save(); render();
}

async function tmdbRefresh() {
  const s = S(); let n = 0;
  try {
    for (const m of s.movies.filter(m => m.tmdbId)) {
      const d = await tmdb('/movie/' + m.tmdbId);
      if (d.budget > 0) m.budget = Math.round(d.budget / 1e5) / 10;
      if (d.revenue > 0) { m.gross = Math.round(d.revenue / 1e5) / 10; n++; }
    }
    toast(`Updated budgets and revenue for ${n} films.`);
  } catch (e) { toast('Refresh failed. Check the API key, or self-host the page so it can reach TMDB.'); }
  save(); render();
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, s = S();
  switch (act) {
    case 'view': ui.view = b.dataset.k; break;
    case 'season': ui.season = b.dataset.k; ui.q = ''; break;
    case 'draft-mode': ui.draftMode = b.dataset.k; ui.q = ''; break;
    case 'start-year': {
      const y = Y(); y.order = league.studios.map(x => x.id).sort(() => Math.random() - .5);
      y.picks = []; y.status = 'drafting'; toast(studio(y.order[0]).name + ' makes the first hit pick.'); break;
    }
    case 'start-draft': {
      const r = parseInt(document.getElementById('rounds').value, 10);
      s.rounds = Math.max(1, Math.min(30, r || 4));
      s.order = league.studios.map(x => x.id).sort(() => Math.random() - .5);
      s.picks = []; s.status = 'drafting'; toast('Draft order set. ' + studio(s.order[0]).name + ' picks first.'); break;
    }
    case 'pick': {
      const year = b.dataset.mode === 'year', d = year ? Y() : s, n = d.order.length, i = d.picks.length;
      const total = year ? Math.min(2 * n, i + yearPool().length) : Math.min(s.rounds * n, i + seasonPool(s).length);
      if (i >= total) return;
      d.picks.push(year ? { movieId: b.dataset.id, studioId: snakeStudio(d.order, i), type: i < n ? 'hit' : 'bomb' }
                        : { movieId: b.dataset.id, studioId: snakeStudio(d.order, i) });
      if (d.picks.length >= total) { d.status = 'live'; toast(year ? 'Hit and bomb picks locked in.' : 'Draft complete. The season is live.'); }
      break;
    }
    case 'undo': { const d = b.dataset.mode === 'year' ? Y() : s; d.picks.pop(); d.status = 'drafting'; break; }
    case 'reset-draft': {
      if (!confirmed('reset' + b.dataset.mode, b, 'Click again to erase all picks')) return;
      const d = b.dataset.mode === 'year' ? Y() : s; d.picks = []; d.order = []; d.status = 'setup'; toast('Draft reset.'); break;
    }
    case 'del-movie': {
      if (yearPickFor(b.dataset.id)) { toast("That film is a hit or bomb pick. Undo or reset the hit & bomb draft first."); return; }
      if (ownerOf(s, b.dataset.id) && !confirmed('dm' + b.dataset.id, b, 'Drafted. Remove?')) return;
      const idx = s.picks.findIndex(p => p.movieId === b.dataset.id);
      if (idx >= 0) { toast('Removed a drafted film. Later picks keep their studios.'); s.picks.splice(idx, 1); }
      s.movies = s.movies.filter(m => m.id !== b.dataset.id); break;
    }
    case 'del-studio': {
      const id = b.dataset.id;
      if ([...Object.values(league.seasons), Y()].some(x => x.picks.some(p => p.studioId === id) || x.order.includes(id))) { toast("That studio is in a draft, so it can't be removed."); return; }
      league.studios = league.studios.filter(x => x.id !== id); break;
    }
    case 'new-league': if (!confirmed('new', b, 'Click again to clear everything')) return;
      newLeague(); toast('New league started with 6 studios. Rename them on the League tab.'); break;
    case 'copy': {
      const ta = document.getElementById('export');
      navigator.clipboard.writeText(ta.value).then(() => toast('League code copied.'), () => { ta.select(); toast('Press Ctrl+C / ⌘C to copy the selected code.'); });
      return;
    }
    case 'import': {
      try {
        const d = JSON.parse(document.getElementById('import').value);
        if (!d.studios || !d.seasons) throw 0;
        league = d; ui.draftMode = null; toast('League loaded.'); ui.view = 'standings';
      } catch (err) { toast("That code isn't a valid league. Copy the whole code and try again."); return; }
      break;
    }
    case 'tmdb-import': tmdbImport(); return;
    case 'tmdb-refresh': tmdbRefresh(); return;
    default: return;
  }
  save(); render();
});

document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target.id;
  if (f === 'add-movie' || f === 'add-year-movie') {
    const t = document.getElementById(f + '-title').value.trim(); if (!t) return;
    const release = document.getElementById(f + '-date').value, key = f === 'add-movie' ? ui.season : seasonForDate(release);
    league.seasons[key].movies.push({ id: uid(), title: t, release, gross: 0, budget: Math.max(0, parseFloat(document.getElementById(f + '-budget').value) || 0) });
    toast(`Added ${t} to the ${seasonMeta(key).name} slate.`);
  } else if (e.target.id === 'add-studio') {
    const name = document.getElementById('st-name').value.trim(); if (!name) return;
    const used = league.studios.map(s => s.color);
    league.studios.push({ id: uid(), name, owner: document.getElementById('st-owner').value.trim(), color: COLORS.find(c => !used.includes(c)) || COLORS[league.studios.length % COLORS.length] });
    toast('Added ' + name + '.');
  } else return;
  league.demo = false; save(); render();
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.gross || t.dataset.budget) {
    const id = t.dataset.gross || t.dataset.budget, m = movieById(S(), id);
    if (m) { m[t.dataset.gross ? 'gross' : 'budget'] = Math.max(0, parseFloat(t.value) || 0); save();
      const cell = document.getElementById('p-' + id); if (cell) cell.innerHTML = profitCell(m); }
  } else if (t.dataset.studio) {
    const st = studio(t.dataset.studio); if (st) { st[t.dataset.f] = t.value; save(); renderMarquee(); }
  } else if (t.dataset.league) {
    const k = t.dataset.league; league[k] = k === 'year' ? (parseInt(t.value, 10) || league.year) : t.value; save(); renderMarquee();
  } else if (t.id === 'q') {
    ui.q = t.value; const pos = t.selectionStart; render();
    const q = document.getElementById('q'); q.focus(); q.setSelectionRange(pos, pos);
  }
});
// Re-render after a gross edit settles so standings and totals refresh
document.addEventListener('change', e => { if (e.target.dataset.gross || e.target.dataset.budget || e.target.dataset.league === 'basis') render(); });

load(); render();
})();
</script>
</body>
