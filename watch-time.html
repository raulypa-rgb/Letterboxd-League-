<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Watch Time League</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Same marquee + trade-sheet look as the Box Office League page, in a deep screening-room dark. */
:root {
  --bg: #0a0c14;
  --surface: #131725;
  --ink: #e8eaf3;
  --muted: #979eb5;
  --line: #262b40;
  --accent: #f0b43a;
  --accent-ink: #1b1400;
  --marquee: #04050b;
  --marquee-ink: #fff3d1;
  --bad: #ef6b70;
  --bar: #00e054;
  --bar-deep: #00a83f;
  --chip: #1f2438;
  --font-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-body); padding: 0 16px 48px; }
a { color: inherit; }
.wrap { max-width: 1080px; margin: 0 auto; display: grid; gap: 20px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; letter-spacing: .01em; }
h2 { font-size: 1.9rem; font-weight: 800; text-transform: uppercase; line-height: 1; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.label { font-size: .72rem; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 600; }

.marquee { border: 1px solid var(--line); margin: 16px auto 0; max-width: 1080px; width: 100%; background: var(--marquee); color: var(--marquee-ink);
  border-radius: 6px; padding: 22px 24px 18px; position: relative; }
.marquee::before, .marquee::after { content: ""; position: absolute; left: 12px; right: 12px; height: 8px;
  background: radial-gradient(circle, var(--accent) 2.6px, transparent 3.2px) 0 0 / 18px 8px repeat-x; }
.marquee::before { top: 6px; } .marquee::after { bottom: 6px; }
.marquee-row { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
.marquee .eyebrow { font-size: .72rem; letter-spacing: .24em; text-transform: uppercase; opacity: .7; font-weight: 600; }
.marquee .eyebrow a { text-decoration-color: color-mix(in srgb, var(--marquee-ink) 45%, transparent); }
.marquee h1 { font-size: clamp(2.2rem, 7vw, 3.8rem); font-weight: 900; text-transform: uppercase; line-height: .95; }
.stepper { display: flex; align-items: center; gap: 6px; }
.stepper button { background: transparent; color: var(--marquee-ink); border: 1.5px solid color-mix(in srgb, var(--marquee-ink) 35%, transparent);
  border-radius: 4px; width: 38px; height: 38px; font-size: 1.1rem; cursor: pointer; }
.stepper button:disabled { opacity: .3; cursor: not-allowed; }
.stepper strong { font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; text-transform: uppercase; min-width: 8.5ch; text-align: center; line-height: 1; }

nav.tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--line); overflow-x: auto; }
nav.tabs button { background: none; border: 0; padding: 10px 14px; font: 600 .95rem var(--font-body); color: var(--muted); cursor: pointer;
  border-bottom: 3px solid transparent; margin-bottom: -2px; white-space: nowrap; }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

.banner { background: var(--chip); border-radius: 6px; padding: 10px 14px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 18px; display: grid; gap: 14px; min-width: 0; }
.head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; display: grid; gap: 2px; align-content: start; }
.tile .v { font-family: var(--font-display); font-weight: 900; font-size: 2.2rem; line-height: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile-text { display: grid; gap: 2px; min-width: 0; }
.tile.has-media { grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: center; }
.tile-poster { width: 50px; aspect-ratio: 2 / 3; object-fit: cover; border-radius: 4px; border: 1px solid var(--line); display: block; }
.tile-avatar { position: relative; width: 50px; height: 50px; border-radius: 50%; overflow: hidden; border: 2px solid var(--accent); display: grid; place-items: center;
  background: var(--chip); font: 800 1.3rem var(--font-display); color: var(--ink); }
.tile-avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.tile .v.name { font-size: 1.7rem; line-height: 1.25; }
.tile .s { font-size: .85rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

button, input, select { font: inherit; color: inherit; }
.btn { background: var(--ink); color: var(--surface); border: 0; border-radius: 4px; padding: 8px 14px; font-weight: 600; cursor: pointer; }
.btn.accent { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn.sm { padding: 4px 10px; font-size: .85rem; }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }
select { background: var(--bg); border: 1.5px solid var(--line); border-radius: 4px; padding: 7px 10px; min-width: 0; }

.tscroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .92rem; }
th { text-align: left; font-size: .7rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 600; padding: 6px 8px; border-bottom: 1.5px solid var(--line); white-space: nowrap; }
td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
td.r, th.r { text-align: right; white-space: nowrap; }
td.member { min-width: 170px; }
tr:last-child td { border-bottom: 0; }
.rank { font-family: var(--font-display); font-weight: 900; font-size: 1.6rem; width: 2.2rem; line-height: 1; }
.rank.first { color: var(--accent); }
.show-sm { display: none; }
td.best { color: var(--accent); font-weight: 500; }
.who { font-weight: 600; }
.bar { height: 6px; background: var(--chip); border-radius: 3px; overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--bar-deep), var(--bar)); box-shadow: 0 0 8px color-mix(in srgb, var(--bar) 35%, transparent); }
.chip { display: inline-block; font-size: .72rem; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--chip); color: var(--muted); white-space: nowrap; }
.chip.warn { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); }


.empty { padding: 22px; text-align: center; color: var(--muted); border: 1.5px dashed var(--line); border-radius: 6px; }
ol.steps { margin: 0; padding-left: 1.3em; display: grid; gap: 8px; }
code { font-family: var(--font-mono); font-size: .85em; background: var(--chip); padding: 1px 5px; border-radius: 3px; }
@media (max-width: 560px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } .tile .s { white-space: normal; overflow-wrap: anywhere; }
  .tile.has-media { grid-template-columns: minmax(0, 1fr); position: relative; }
  .tile.has-media .label { padding-right: 40px; min-height: 2.6em; }
  .tile.has-media > .tile-poster, .tile.has-media > .tile-avatar { position: absolute; top: 12px; right: 12px; width: 34px; }
  .tile.has-media > .tile-avatar { height: 34px; font-size: .95rem; border-width: 1.5px; } .hide-sm { display: none; } .show-sm { display: block !important; } td.member { min-width: 96px; } td { padding: 8px 5px; } th { padding: 6px 5px; } table { font-size: .85rem; } .rank { font-size: 1.3rem; width: 1.4rem; } .panel { padding: 14px; } .tile .v { font-size: 1.8rem; } .tile .v.name { font-size: 1.35rem; line-height: 1.6; } }
</style>
</head>
<body>
<header class="marquee" id="marquee"></header>
<main class="wrap" style="margin-top:16px">
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <div id="view" class="wrap" style="width:100%"></div>
</main>
<script>
(() => {
const VIEWS = [['month', 'Month'], ['setup', 'Members & setup']];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const hm = min => { min = Math.round(min || 0); const h = Math.floor(min / 60), m = min % 60; return h ? `${h}h ${String(m).padStart(2, '0')}m` : `${m}m`; };
const hrs = min => (min / 60).toFixed(min >= 6000 ? 0 : 1);
const monthKey = d => d.slice(0, 7);
const monthName = (k, long) => { const [y, m] = k.split('-'); return new Date(+y, +m - 1, 15).toLocaleDateString('en-US', { month: long ? 'long' : 'short', year: 'numeric' }); };
const shiftMonth = (k, n) => { const [y, m] = k.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; };
const fmtDay = d => new Date(d + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
const nowKey = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; };

let data = { members: [], entries: [] };
let demo = false, loadError = '';
const ui = { view: 'month', month: nowKey() };

// Hash keeps the view and month shareable: #month/2026-09
function readHash() {
  const [v, m] = location.hash.slice(1).split('/');
  if (VIEWS.some(([k]) => k === v)) ui.view = v;
  if (/^\d{4}-\d{2}$/.test(m || '')) ui.month = m;
}
function writeHash() { history.replaceState(null, '', `#${ui.view}/${ui.month}`); }

const members = () => data.members.length ? data.members
  : [...new Set(data.entries.map(e => e.user))].map(u => ({ username: u, name: u }));
const nameOf = u => (members().find(m => m.username === u) || {}).name || u;

function monthStats(key) {
  const rows = members().map(m => ({ m, min: 0, films: 0, rewatches: 0, missing: 0, longest: null }));
  for (const e of data.entries) {
    if (monthKey(e.date) !== key) continue;
    const r = rows.find(x => x.m.username === e.user);
    if (!r) continue;
    r.films++; if (e.rewatch) r.rewatches++;
    if (e.runtime) { r.min += e.runtime; if (!r.longest || e.runtime > r.longest.runtime) r.longest = e; } else r.missing++;
  }
  for (const r of rows) r.avg = r.films > r.missing ? r.min / (r.films - r.missing) : 0;
  return rows.sort((a, b) => b.min - a.min || b.films - a.films || a.m.name.localeCompare(b.m.name));
}

function render() {
  writeHash();
  document.getElementById('marquee').innerHTML = `<div class="marquee-row">
    <div><div class="eyebrow">Letterboxd League · <a href="index.html">Box Office League</a></div><h1>Watch Time</h1></div>
    <div class="stepper" aria-label="Month">
      <button data-act="step" data-n="-1" aria-label="Previous month">◀</button>
      <strong>${monthName(ui.month)}</strong>
      <button data-act="step" data-n="1" aria-label="Next month" ${ui.month >= nowKey() ? 'disabled' : ''}>▶</button>
    </div></div>`;
  document.getElementById('tabs').innerHTML = VIEWS.map(([k, n]) =>
    `<button role="tab" data-act="view" data-k="${k}" aria-selected="${ui.view === k}">${n}</button>`).join('');
  const banner = demo ? `<div class="banner"><span><strong>Demo data.</strong> These members are made up. Add real usernames on the Members &amp; setup tab.</span>
      <button class="btn ghost sm" data-act="undemo">Hide demo</button></div>`
    : !data.entries.length ? `<div class="banner"><span>${loadError ? esc(loadError) : 'No viewings logged yet.'} See <strong>Members &amp; setup</strong> to start tracking.</span>
      <button class="btn accent sm" data-act="demo">Show demo data</button></div>` : '';
  document.getElementById('view').innerHTML = banner + ({ month: viewMonth, setup: viewSetup })[ui.view]();
}

// Summary box; media (a poster or profile picture) sits to the left of the text.
const tile = (label, value, sub, media = '', cls = 'num') => `<div class="tile${media ? ' has-media' : ''}">${media}
  <div class="tile-text"><span class="label">${label}</span><span class="v ${cls}">${value}</span><span class="s">${sub}</span></div></div>`;
const poster = e => e.poster ? `<img class="tile-poster" src="${esc(e.poster)}" alt="${esc(e.title)} poster" loading="lazy" onerror="this.remove()">` : '';
const avatar = m => `<span class="tile-avatar">${esc(((m && m.name) || '?').slice(0, 1).toUpperCase())}${m && m.avatar
  ? `<img src="${esc(m.avatar)}" alt="" onerror="this.remove()">` : ''}</span>`;

function viewMonth() {
  const rows = monthStats(ui.month);
  const total = rows.reduce((s, r) => s + r.min, 0), films = rows.reduce((s, r) => s + r.films, 0);
  const max = Math.max(1, ...rows.map(r => r.min));
  const leader = rows[0] && rows[0].min ? rows[0] : null;
  const longest = rows.map(r => r.longest).filter(Boolean).sort((a, b) => b.runtime - a.runtime)[0];
  const prev = monthStats(shiftMonth(ui.month, -1));
  const monthEntries = data.entries.filter(e => monthKey(e.date) === ui.month && rows.some(r => r.m.username === e.user));
  const longAvg = rows.filter(r => r.avg).sort((a, b) => b.avg - a.avg)[0];
  const lead = rows.length > 1 && rows[1].min ? { gap: rows[0].min - rows[1].min } : null;
  // Most time one member logged on a single day this month.
  const days = {};
  for (const e of monthEntries) if (e.runtime) days[e.user + ' ' + e.date] = (days[e.user + ' ' + e.date] || 0) + e.runtime;
  const [marathonKey, marathonMin] = Object.entries(days).sort((a, b) => b[1] - a[1])[0] || [];
  const oldest = monthEntries.filter(e => e.year).sort((a, b) => a.year - b.year || a.date.localeCompare(b.date))[0];
  const leaderInfo = leader && members().find(m => m.username === leader.m.username);
  const tiles = `<div class="tiles">
    ${tile('League total', `${hrs(total)}<small style="font-size:.5em">h</small>`, `${films} film${films === 1 ? '' : 's'} logged`)}
    ${tile('Leader', leader ? esc(leader.m.name) : '—', leader ? hm(leader.min) : 'Nobody has logged a film yet', leader ? avatar(leaderInfo) : '', 'name')}
    ${tile('Lead over 2nd', lead ? hm(lead.gap) : '—', !lead ? 'Needs two members with time logged' : lead.gap ? `Ahead of ${esc(rows[1].m.name)}` : `Tied: ${esc(rows[0].m.name)} &amp; ${esc(rows[1].m.name)}`)}
    ${tile('Marathon day', marathonKey ? hm(marathonMin) : '—', marathonKey ? `${esc(nameOf(marathonKey.split(' ')[0]))} · ${fmtDay(marathonKey.split(' ')[1])}` : 'No films yet')}
    ${tile('Oldest film', oldest ? oldest.year : '—', oldest ? `${esc(oldest.title)} · ${esc(nameOf(oldest.user))}` : 'No films yet', oldest ? poster(oldest) : '')}
    ${tile('Longest sit', longest ? hm(longest.runtime) : '—', longest ? `${esc(longest.title)} · ${esc(nameOf(longest.user))}` : 'No films yet', longest ? poster(longest) : '')}
  </div>`;
  if (!rows.length) return tiles + `<div class="empty">No members yet.</div>`;
  const table = `<section class="panel"><div class="head"><h2>${monthName(ui.month, true)}</h2><span class="muted small">Ranked by total runtime of films logged in the diary this month. Rewatches count.</span></div>
    <div class="tscroll"><table>
    <thead><tr><th></th><th>Member</th><th class="r hide-sm">Films</th><th class="r hide-sm">Rewatches</th><th class="r" title="Average runtime of the films they logged">Avg<span class="hide-sm"> runtime</span></th><th class="r hide-sm">vs last month</th><th class="r"><span class="hide-sm">Watch </span>time</th></tr></thead>
    <tbody>${rows.map((r, i) => {
      const p = prev.find(x => x.m.username === r.m.username), d = r.min - (p ? p.min : 0);
      return `<tr>
      <td><span class="rank ${i === 0 && r.min ? 'first' : ''}">${i + 1}</span></td>
      <td class="member"><span class="who">${esc(r.m.name)}</span>
        ${r.missing ? `<span class="chip warn" title="Films without a runtime aren't counted yet">${r.missing} missing runtime</span>` : ''}
        <div class="muted small show-sm">${r.films} film${r.films === 1 ? '' : 's'}</div>
        <div class="bar" title="${esc(r.m.name)}: ${hm(r.min)}"><i style="width:${(r.min / max * 100).toFixed(1)}%"></i></div></td>
      <td class="r num hide-sm">${r.films}</td>
      <td class="r num hide-sm">${r.rewatches}</td>
      <td class="r num ${longAvg && r === longAvg ? 'best' : ''}">${r.avg ? hm(r.avg) : '—'}</td>
      <td class="r num hide-sm muted">${d === 0 ? '—' : (d > 0 ? '+' : '−') + hm(Math.abs(d))}</td>
      <td class="r num"><strong>${hm(r.min)}</strong></td></tr>`;
    }).join('')}</tbody></table></div></section>`;
  return tiles + table;
}

function viewSetup() {
  const ms = demo ? [] : data.members;
  return `<section class="panel"><div class="head"><h2>Members</h2>${data.updated ? `<span class="muted small">Last update ${new Date(data.updated).toLocaleString()}</span>` : ''}</div>
    ${ms.length ? `<div class="tscroll"><table><thead><tr><th>Member</th><th>Letterboxd</th><th class="r">Viewings saved</th><th>Status</th></tr></thead><tbody>
      ${ms.map(m => `<tr><td class="who">${esc(m.name)}</td><td><a href="https://letterboxd.com/${esc(m.username)}/" target="_blank" rel="noopener">${esc(m.username)}</a></td>
        <td class="r num">${data.entries.filter(e => e.user === m.username).length}</td>
        <td>${m.error ? `<span class="chip warn" title="${esc(m.error)}">Fetch failed</span>` : m.lastFetched ? `<span class="chip">Synced ${new Date(m.lastFetched).toLocaleDateString()}</span>` : '<span class="chip">Pending</span>'}</td></tr>`).join('')}
    </tbody></table></div>` : '<div class="empty">No members are being tracked yet.</div>'}
  </section>
  <section class="panel"><h2>How it works</h2>
    <ol class="steps">
      <li>List everyone's Letterboxd username in <code>data/members.json</code> and commit it. Diaries must be public.</li>
      <li>The <strong>Update watch time</strong> GitHub Action reads each member's diary RSS feed every 5 minutes, looks up each film's runtime, and saves the viewings to <code>data/watch-time.json</code>. Run it by hand from the repo's Actions tab any time.</li>
      <li>Watch time for a month is the sum of runtimes of every film a member logged in their diary with a watched date in that month. Rewatches count; films logged without a date don't.</li>
      <li>Letterboxd's feed only holds each member's latest ~50 entries, so tracking starts from the first run and keeps every viewing it has seen since.</li>
      <li>Optional: add a <code>TMDB_API_KEY</code> repository secret for faster, more reliable runtimes. Without it, runtimes are read from each film's Letterboxd page.</li>
      <li>Turn on GitHub Pages for the repo and open <code>watch-time.html</code>.</li>
    </ol>
  </section>`;
}

function demoData() {
  const people = [['cinephile_sam', 'Sam'], ['jordanwatches', 'Jordan'], ['alex_reels', 'Alex'], ['priya.films', 'Priya'], ['morgan_m', 'Morgan'], ['casey_c', 'Casey']];
  const films = [['Past Lives', 2023, 106], ['Dune: Part Two', 2024, 166], ['Anatomy of a Fall', 2023, 152], ['Perfect Days', 2023, 124], ['The Holdovers', 2023, 133],
    ['Challengers', 2024, 131], ['Oppenheimer', 2023, 180], ['Aftersun', 2022, 102], ['In the Mood for Love', 2000, 99], ['Paddington 2', 2017, 104],
    ['Seven Samurai', 1954, 207], ['Before Sunrise', 1995, 101], ['Parasite', 2019, 133], ['The Zone of Interest', 2023, 105], ['Mad Max: Fury Road', 2015, 121],
    ['Spirited Away', 2001, 125], ['Heat', 1995, 170], ['Nope', 2022, 130], ['Portrait of a Lady on Fire', 2019, 122], ['Barbie', 2023, 114]];
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const entries = [], end = nowKey();
  people.forEach(([u], pi) => {
    const pace = 3 + pi * 1.6;
    for (let n = 11; n >= 0; n--) {
      const k = shiftMonth(end, -n), count = Math.max(0, Math.round(pace + (rnd() - .5) * 6));
      const days = n === 0 ? new Date().getDate() : 28;
      for (let j = 0; j < count; j++) {
        const [title, year, runtime] = films[Math.floor(rnd() * films.length)];
        const date = `${k}-${String(1 + Math.floor(rnd() * days)).padStart(2, '0')}`;
        entries.push({ id: `${u}-${k}-${j}`, user: u, date, title, year, runtime, rewatch: rnd() < .2, rating: Math.round(rnd() * 6 + 4) / 2, link: '', poster: '' });
      }
    }
  });
  return { updated: new Date().toISOString(), members: people.map(([username, name]) => ({ username, name })), entries };
}

let real = data;
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'view') ui.view = b.dataset.k;
  else if (act === 'step') ui.month = shiftMonth(ui.month, +b.dataset.n) > nowKey() ? nowKey() : shiftMonth(ui.month, +b.dataset.n);
  else if (act === 'demo') { demo = true; data = demoData(); }
  else if (act === 'undemo') { demo = false; data = real; }
  else return;
  render();
});
window.addEventListener('hashchange', () => { readHash(); render(); });

readHash();
render();
fetch('data/watch-time.json', { cache: 'no-store' })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(j => {
    real = data = { updated: j.updated, members: j.members || [], entries: (j.entries || []).filter(e => e.date) };
    // If nothing is logged yet this month, open on the latest month that has viewings.
    const latest = data.entries.map(e => monthKey(e.date)).sort().pop();
    if (!location.hash && latest && !data.entries.some(e => monthKey(e.date) === ui.month)) ui.month = latest;
    render();
  })
  .catch(() => { loadError = "Couldn't load data/watch-time.json (open the page from a web server or GitHub Pages, not straight from disk)."; render(); });
})();
</script>
</body>
</html>
